# 사람 인증 구성요소(identity, identity-proxy, identity-db)와 공개 입구를 지금 빌드한 platform 이미지로 함께 띄우는 개발·시험 구성(D22 compose.dev.yaml). 운영 배치는 deploy 가 정한다.
# 이 파일은 tests/test-idp-smoke.sh 가 변수를 채워 쓴다. 이웃 영역은 없다(인증을 통과한 요청은 상류 부재로 5xx 가 된다).
# 각 이미지는 계약 Env 스키마(IdentityEnv, IdentityProxyEnv, AreaDatabaseEnv, AreaGatewayEnv, PublicIngressEnv)의 이름만 받는다. 서비스 TLS 는 영역 게이트웨이 이미지가 서비스 이름 인증서로 끝낸다(ADR 0001).
x-hardening: &hardening
  restart: "no"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
x-pause: &pause
  image: ${PAUSE_IMAGE:?}
  user: "65535:65535"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 같은 네트워크 공간의 영역 게이트웨이가 추가 capability 없이 443 을 연다
x-areagw: &areagw
  <<: *hardening
  image: ${AREA_GATEWAY_IMAGE:?}
  user: "101:101"
  tmpfs: ["/tmp"]
networks:
  auth: {}
  db: {internal: true}
secrets:
  identity-client-secret: {file: "${IDP_SECRETS:?}/identity-client-secret"}
  identity-cookie-secret: {file: "${IDP_SECRETS}/identity-cookie-secret"}
  identity-admin-password: {file: "${IDP_SECRETS}/identity-admin-password"}
  identity-initial-admin-password: {file: "${IDP_SECRETS}/identity-initial-admin-password"}
  identity-db-url: {file: "${IDP_SECRETS}/identity-db-url"}
  postgres-password: {file: "${IDP_SECRETS}/postgres-password"}
  db-identity: {file: "${IDP_SECRETS}/db-identity"}
services:
  identity-db:
    <<: *hardening
    image: ${IDENTITY_DB_IMAGE:?}
    group_add: ["${SECRETS_GID:?}"]
    environment: {POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password}
    secrets: [postgres-password, {source: db-identity, target: db/identity}]
    volumes: ["${PKI_DIR:?}/certs:/certs:ro", "identity-db-data:/var/lib/postgresql/data"]
    tmpfs: ["/tmp", "/var/run/postgresql:uid=999,gid=999"]
    networks: {db: {aliases: [identity-db]}}
  identity-net:
    <<: *pause
    networks: {auth: {aliases: [identity]}, db: {}}
  identity:
    <<: *hardening
    image: ${IDENTITY_IMAGE:?}
    network_mode: "service:identity-net"
    group_add: ["${SECRETS_GID}"]
    tmpfs: ["/tmp", "/opt/keycloak/data/tmp", "/opt/keycloak/data/import"]
    volumes: ["${PKI_DIR}/root_ca.crt:/etc/openit/pki/root_ca.crt:ro"]
    environment: {IDENTITY_PUBLIC_URL: "${PUBLIC_URL:?}"}
    secrets: [identity-client-secret, identity-admin-password, identity-initial-admin-password, identity-db-url]
    depends_on: {identity-db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  identity-gw:
    <<: *areagw
    network_mode: "service:identity-net"
    environment: {AREA_GATEWAY_UPSTREAM: "127.0.0.1:8080"}
    volumes: ["${PKI_DIR}/certs:/certs:ro", "${IDENTITY_DIR:?}/exposure-identity.json:/etc/openit/exposure.json:ro"]
    depends_on: {identity: {condition: service_healthy}}
  identity-proxy-net:
    <<: *pause
    networks: {auth: {aliases: [identity-proxy]}}
  identity-proxy:
    <<: *hardening
    image: ${IDENTITY_PROXY_IMAGE:?}
    network_mode: "service:identity-proxy-net"
    group_add: ["${SECRETS_GID}"]
    volumes: ["${PKI_DIR}/root_ca.crt:/etc/openit/pki/root_ca.crt:ro"]
    environment: {IDENTITY_PUBLIC_URL: "${PUBLIC_URL}", OPENIT_EGRESS_PROXY: "http://127.0.0.1:3128"}   # identity 로 가는 호출은 자기 영역 게이트웨이(identity-proxy-gw)의 CONNECT 출구로 나간다(R1.8)
    secrets: [identity-client-secret, identity-cookie-secret]
    depends_on: {identity-gw: {condition: service_started}}
  identity-proxy-gw:
    <<: *areagw
    network_mode: "service:identity-proxy-net"
    environment: {AREA_GATEWAY_UPSTREAM: "127.0.0.1:4180"}
    volumes: ["${PKI_DIR}/certs:/certs:ro", "${PROXY_EXPOSURE:-${IDENTITY_DIR}/exposure-identity-proxy.json}:/etc/openit/exposure.json:ro"]
  gateway:
    <<: *hardening
    image: ${INGRESS_IMAGE:?}
    user: "10001:10001"
    group_add: ["${SECRETS_GID}"]
    tmpfs: ["/tmp:uid=10001,gid=10001", "/data:uid=10001,gid=10001", "/config:uid=10001,gid=10001", "/etc/openit/root-out:uid=10001,gid=10001,mode=755"]
    networks: [auth]
    ports: ["127.0.0.1:${PUBLIC_PORT:?}:8443"]
    environment:
      GATEWAY_TLS_MODE: files   # 시험 PKI 의 서버 인증서(IP SAN 포함): 시험 클라이언트가 루트 인증서 하나만 신뢰한다
      GATEWAY_HOSTS: "${GATEWAY_HOSTS:-localhost:8443}"
      GATEWAY_PUBLIC_TLS_PORT: "${PUBLIC_PORT}"
      LOGIN_RATE_EVENTS: "1000"   # 이 스모크는 한 주소에서 로그인을 수십 번 한다: 속도 제한(R10.4, 기본 30/분)은 test-gateway-auth.sh 가 따로 시험한다
    volumes:
      - ${PKI_DIR}/root_ca.crt:/etc/openit/pki/root_ca.crt:ro
      - ${PKI_DIR}/certs:/etc/openit/ingress-tls:ro
      - ${DEVICE_CA:?}:/etc/openit/device-ca.pem:ro   # 기기 CA(계약 PublicIngressEnv.INGRESS_DEVICE_CA_FILE, 필수)
      - ${EXPOSURES_DIR:?}:/etc/openit/exposures:ro
      - ${SECRETS_DIR:?}/tokens:/run/secrets:ro
    depends_on: {identity-proxy-gw: {condition: service_started}, identity-gw: {condition: service_started}}
volumes:
  identity-db-data: {}
